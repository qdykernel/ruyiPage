name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Run fast tests
        run: python -m pytest -m fast -q

      - name: Install managed Firefox
        shell: powershell
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "ruyipage-browsers"
          $expectedJson = python -c "import json; from ruyipage._runtime.manifest import RUNTIMES; print(json.dumps(RUNTIMES['win64']))"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the managed Firefox manifest"
          }
          $expected = $expectedJson | ConvertFrom-Json
          $installJson = python -m ruyipage install --install-dir "$installRoot" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Managed Firefox install failed with exit code $LASTEXITCODE"
          }

          $runtime = $installJson | ConvertFrom-Json
          foreach ($field in @("version", "release", "asset")) {
            if ($runtime.$field -ne $expected.$field) {
              throw "Expected runtime $field '$($expected.$field)', got '$($runtime.$field)'"
            }
          }
          if (-not (Test-Path -LiteralPath $runtime.executable_path -PathType Leaf)) {
            throw "Managed Firefox executable not found: $($runtime.executable_path)"
          }

          "RUYIPAGE_TEST_FIREFOX_PATH=$($runtime.executable_path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run smoke tests
        run: python -m pytest tests/smoke -m browser -q

      - name: Run feature tests
        run: python -m pytest tests/features -m browser -q

      - name: Run async browser smoke tests
        run: python -m pytest tests/async_smoke/test_async_smoke.py -m browser -q

      - name: Run integration tests
        run: python -m pytest tests/integration -m browser -q

      - name: Run release gate
        run: python -m pytest tests/release -m browser -q
